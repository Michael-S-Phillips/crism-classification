name: crism
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - geopandas=1.0.1
  - rasterio=1.4.3
  - numpy<2.0
  - scipy>=1.12
  - spectral
  - matplotlib
  - pandas
  - tqdm
  - pyyaml
  - pyarrow
  - pytest
  - pip
  - pip:
    - scikit-learn>=1.4
    - xgboost>=2.0
    - lightgbm>=4.0
    - wandb
    - openpyxl
    # For GPU support, install torch manually after env creation:
    # pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    - torch
    - torchvision

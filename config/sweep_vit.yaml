program: scripts/train.py
method: bayes
metric:
  name: val_mAP
  goal: maximize
parameters:
  model:
    value: vit
  lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  embed_dim:
    values: [64, 128, 256]
  n_heads:
    values: [4, 8]
  n_layers:
    values: [2, 4, 6]
  patch_size:
    values: [5, 7, 9]
  epochs:
    value: 100
  patience:
    value: 10

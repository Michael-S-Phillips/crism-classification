program: scripts/train.py
method: bayes
metric:
  name: val_mAP
  goal: maximize
parameters:
  model:
    value: cnn
  lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  batch_size:
    values: [64, 128, 256]
  patch_size:
    values: [5, 7, 9]
  epochs:
    value: 100
  patience:
    value: 10
